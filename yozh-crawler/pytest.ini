[pytest]
# Without this the suite only resolves `src.*` when invoked as
# `python -m pytest` from this directory, which puts CWD on sys.path —
# a bare `pytest` (what CI and most editors run) fails on the imports.
pythonpath = .
testpaths = tests
# Mirrors the root ini: --strict-markers turns a typo into an error, which
# only works if the markers this repo uses are registered. Nothing here is
# e2e today; it is registered so the first test that needs it can be
# excluded from the gate instead of silently joining it.
markers =
    e2e: needs a live browser, real servers or network; excluded from the fast gate
addopts = --strict-markers
